<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remesas Vázquez</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #0b5cff;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #0b5cff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      background: #eef4ff;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>Remesas Vázquez</h1>
  <p>Envía dinero de forma rápida y segura</p>
</header>

<main>
  <div class="card">
    <h2>Enviar dinero</h2>

    <label>País de destino</label>
    <select>
      <option>Selecciona un país</option>
      <option>Cuba</option>

    <label>Cantidad a enviar</label>
    <input type="number" placeholder="Ejemplo: 500">

    <label>Nombre del destinatario</label>
    <input type="text" placeholder="Nombre completo">

    <label>Teléfono del destinatario</label>
    <input type="tel" placeholder="Número de teléfono">

    <button type="button" onclick="enviarWhatsApp()"> Solicitar envío por WhatsApp </button>

    <div class="resultado">
      <strong>Remesas Vázquez</strong>
      <p>Tu solicitud será revisada antes de confirmar el envío.</p>
    </div>
  </div>
</main>
<
</body>
</html>
